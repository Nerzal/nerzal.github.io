  - { "@type": Game, name: Dudes of Wizardry, url: https://nerzal.itch.io/dudes-of-wizardry, description: Ludum Dare 44 entry (2019)., contributor: [{ "@type": Person, name: Wr4thon }] }
  - { "@type": Game, name: Racoonventure, url: https://nerzal.itch.io/racoonventure, description: Ludum Dare 45 entry (2019). }
  - { "@type": Game, name: "Ignitus Dead Paw: The Revenge", url: https://nerzal.itch.io/ignitus-dead-paw-the-revenge, description: Ludum Dare 46 entry (2020)., contributor: [{ "@type": Person, name: Wr4thon }, { "@type": Person, name: WelverinRaven }, { "@type": Person, name: iFratze }] }
  - { "@type": Game, name: Book of the Dread, url: https://nerzal.itch.io/book-of-the-dread, description: Ludum Dare 48 entry (2021)., contributor: [{ "@type": Person, name: Wr4thon }, { "@type": Person, name: Welverin }] }
  - { "@type": Game, name: "Sir Blackmoon's Nightmare", url: https://nerzal.itch.io/sir-blackmoons-nightmare, description: Ludum Dare 50 entry (2022)., contributor: [{ "@type": Person, name: Wr4thon }] }
