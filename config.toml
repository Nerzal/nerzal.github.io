baseURL = 'https://blog.noobygames.de'
locale = 'en-US'
title = 'Tobias Theel | Senior Software Engineer'
theme = "ananke"
DefaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
Paginate = 10
enableRobotsTXT = true

[languages]
  [languages.en]
    label = "English"
    weight = 1
    contentDir = "content/en"
  [languages.de]
    label = "Deutsch"
    weight = 2
    contentDir = "content/de"

[sitemap]
  changefreq = "monthly"
  priority = 0.6
  filename = "sitemap.xml"

[params]
  text_color = "#e4f1fe"
  author = "Tobias Theel"
  tagline = "Senior Software Engineer"
  location = "Fritzlar, Germany"
  location_tz = "UTC+1/UTC+2"
  description = "Remote-first Senior Software Engineer specializing in Go, Cloud-Native architecture, and Game Development. 12+ years of experience in distributed environments."
  # choose a background color from any on this page: https://tachyons.io/docs/themes/skins/ and preface it with "bg-"
  background_color_class = "background-dark"
  recent_posts_number = 3
  google_site_verification = "8UCdbb2gsDSz40pl3KNnBBuwy4kSU5Jw1xfET009Qjw"
  # Get this from https://www.bing.com/webmasters — Site verification → BingSiteAuth (meta tag option)
  # bing_site_verification = ""

# Pages listed under the "publications" menu (desktop + mobile submenu and the overview grid).
# label_key is an i18n key for the category eyebrow on the overview cards.
[[params.publications]]
  path = "/page/book"
  label_key = "catBook"
[[params.publications]]
  path = "/page/talks"
  label_key = "catTalks"
[[params.publications]]
  path = "/page/open-source"
  label_key = "catOpenSource"
[[params.publications]]
  path = "/page/games"
  label_key = "catGames"
[[params.publications]]
  path = "/page/neuroclip"
  label_key = "catProduct"
[[params.publications]]
  path = "/page/level-time"
  label_key = "catProduct"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.highlight]
    noClasses = false
    codeFences  = true
    lineNos     = false
    tabWidth    = 2

 
[params.footer]
    enable_menu_footer_primary = true
    footer_primary_menu_title = "Impressum"


[[params.socials]]
  name = "linkedin"
  url = "https://www.linkedin.com/in/tobias-theel-3353a9181"
  follow = true
  share = true
  color = "#0077b5"

[[params.socials]]
  name = "github"
  url = "https://github.com/Nerzal"
  follow = true
  color = "#333"

[[params.socials]]
  name = "bluesky"
  url = "https://bsky.app/profile/nerzal.bsky.social"
  share = true
  follow = true
  color = "#0560ff"


[privacy]
  [privacy.instagram]
    disable = true
  [privacy.vimeo]
    disable = true
  [privacy.youtube]
    disable = true
