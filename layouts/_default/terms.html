{{ define "main" }}
<div class="mw8 center ph3 ph4-l pv4 pv5-l">
    <header class="blog-list-header">
        <p class="blog-list-eyebrow">{{ i18n "browse" | default "Browse" }}</p>
        <h1 class="blog-list-title">{{ .Data.Plural | humanize }}</h1>
        <p class="blog-list-count">{{ len .Data.Terms }} {{ .Data.Singular | humanize }}s</p>
    </header>
    <div class="terms-grid">
        {{ range .Data.Terms.Alphabetical }}
        <a href="{{ .Page.RelPermalink }}" class="term-card">
            <span class="term-card-name">{{ .Page.Title }}</span>
            <span class="term-card-count">{{ .Count }}</span>
        </a>
        {{ end }}
    </div>
</div>
{{ end }}
