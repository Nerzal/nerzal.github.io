{{ define "main" }}
{{ $term := .Title }}
{{ $pages := .Pages }}
<div class="blog-list-page mw9 center ph3 ph4-l pv4 pv5-l">
    <header class="blog-list-header">
        <p class="blog-list-eyebrow">{{ .Data.Singular | humanize }}</p>
        <h1 class="blog-list-title">{{ $term }}</h1>
        <p class="blog-list-count">{{ len $pages }} {{ i18n "articlesLabel" | default "articles" }}</p>
    </header>
    <div class="blog-grid">
        {{ range $pages }}
        {{ .Render "summary" }}
        {{ end }}
    </div>
</div>
{{ end }}
