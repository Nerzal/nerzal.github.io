{{/* JSON-LD structured data — Article for blog posts, WebSite for other pages */}}
{{ if and .IsPage (eq .Section "blog") }}
{{ $img := partialCached "func/GetFeaturedImage.html" . .RelPermalink }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "TechArticle",
  "headline": {{ .Title | jsonify }},
  "description": {{ with .Description }}{{ . | jsonify }}{{ else }}{{ .Summary | jsonify }}{{ end }},
  "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
  "url": "{{ .Permalink }}",
  {{ with $img }}"image": "{{ . | absURL }}",{{ end }}
  "author": {
    "@type": "Person",
    "name": {{ site.Params.author | jsonify }},
    "url": "{{ site.BaseURL }}"
  },
  "publisher": {
    "@type": "Person",
    "name": {{ site.Params.author | jsonify }},
    "url": "{{ site.BaseURL }}"
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ .Permalink }}"
  }
}
</script>
{{ else if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfilePage",
  "url": "{{ .Permalink }}",
  "name": {{ site.Title | jsonify }},
  "description": {{ site.Params.description | jsonify }},
  "mainEntity": {
    "@type": "Person",
    "name": {{ site.Params.author | jsonify }},
    "jobTitle": {{ site.Params.tagline | jsonify }},
    "url": "{{ site.BaseURL }}",
    "sameAs": [
      {{ range $i, $s := site.Params.socials }}{{ if $i }},{{ end }}"{{ $s.url }}"{{ end }}
    ]
  }
}
</script>
{{ end }}
