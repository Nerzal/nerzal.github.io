{{/* For Users's overwrite */}}
<script>
document.addEventListener('DOMContentLoaded', function () {

    // Hamburger menu
    var hamburger = document.querySelector('.hamburger');
    var navRight  = document.getElementById('site-nav-right');
    if (hamburger && navRight) {
        hamburger.addEventListener('click', function () {
            var open = navRight.classList.toggle('is-open');
            hamburger.setAttribute('aria-expanded', open);
        });
        document.addEventListener('click', function (e) {
            if (!hamburger.contains(e.target) && !navRight.contains(e.target)) {
                navRight.classList.remove('is-open');
                hamburger.setAttribute('aria-expanded', 'false');
            }
        });
        navRight.querySelectorAll('.site-nav-link').forEach(function (link) {
            link.addEventListener('click', function () {
                navRight.classList.remove('is-open');
                hamburger.setAttribute('aria-expanded', 'false');
            });
        });
    }

    // Scroll-to-top button
    var btn = document.getElementById('scroll-to-top');
    if (btn) {
        window.addEventListener('scroll', function () {
            btn.classList.toggle('visible', window.scrollY > 300);
        }, { passive: true });
        btn.addEventListener('click', function () {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    }

    // Copy button on code blocks
    document.querySelectorAll('pre').forEach(function (pre) {
        var button = document.createElement('button');
        button.className = 'copy-btn';
        button.textContent = 'Copy';
        button.addEventListener('click', function () {
            var code = pre.querySelector('code');
            var text = code ? code.innerText : pre.innerText;
            navigator.clipboard.writeText(text).then(function () {
                button.textContent = 'Copied!';
                button.classList.add('copied');
                setTimeout(function () {
                    button.textContent = 'Copy';
                    button.classList.remove('copied');
                }, 2000);
            });
        });
        pre.appendChild(button);
    });

});
</script>
