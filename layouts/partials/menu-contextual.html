{{ if .Params.toc }}
<div class="sidebar-card">
    <p class="sidebar-card-title">{{ i18n "onThisPage" | default "On this page" }}</p>
    <div class="sidebar-toc">{{ .TableOfContents }}</div>
</div>
{{ end }}

{{ $related := .Site.RegularPages.Related . | first 5 }}
{{ with $related }}
<div class="sidebar-card">
    <p class="sidebar-card-title">{{ i18n "related" }}</p>
    <ul class="sidebar-related-list">
        {{ range . }}
        <li class="sidebar-related-item">
            <a href="{{ .RelPermalink }}" class="sidebar-related-link">{{ .Title }}</a>
        </li>
        {{ end }}
    </ul>
</div>
{{ end }}
