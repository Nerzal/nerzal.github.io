{{ define "main" }}
<canvas id="gol-404-canvas" aria-hidden="true"></canvas>
<div class="not-found-page mw8 center ph3 ph4-l pv5 pv6-l tc">
    <p class="not-found-code">404</p>
    <h1 class="not-found-title">Page not found</h1>
    <p class="not-found-desc">The page you're looking for has moved, was removed, or never existed.</p>
    <div class="not-found-actions">
        <a href="{{ "/" | relURL }}" class="site-btn site-btn--primary">Back to Home</a>
        <a href="{{ "/blog/" | relURL }}" class="site-btn site-btn--outline">Read the Blog</a>
    </div>
</div>
<script>
(function () {
    var canvas = document.getElementById('gol-404-canvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var cellSize = 10, cols, rows, cells, next, rafId;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        cols = Math.ceil(canvas.width / cellSize);
        rows = Math.ceil(canvas.height / cellSize);
        cells = new Uint8Array(cols * rows);
        next = new Uint8Array(cols * rows);
        for (var i = 0; i < cells.length; i++) {
            cells[i] = Math.random() < 0.3 ? 1 : 0;
        }
    }

    function step() {
        for (var y = 0; y < rows; y++) {
            for (var x = 0; x < cols; x++) {
                var n = 0;
                for (var dy = -1; dy <= 1; dy++) {
                    for (var dx = -1; dx <= 1; dx++) {
                        if (dx === 0 && dy === 0) continue;
                        n += cells[((y + dy + rows) % rows) * cols + (x + dx + cols) % cols];
                    }
                }
                var a = cells[y * cols + x];
                next[y * cols + x] = (a && (n === 2 || n === 3)) || (!a && n === 3) ? 1 : 0;
            }
        }
        var tmp = cells; cells = next; next = tmp;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00ff7f';
        for (var y = 0; y < rows; y++) {
            for (var x = 0; x < cols; x++) {
                if (cells[y * cols + x]) {
                    ctx.fillRect(x * cellSize + 1, y * cellSize + 1, cellSize - 2, cellSize - 2);
                }
            }
        }
    }

    function loop() { step(); draw(); rafId = requestAnimationFrame(loop); }

    resize();
    window.addEventListener('resize', function () {
        cancelAnimationFrame(rafId);
        resize();
        rafId = requestAnimationFrame(loop);
    });
    rafId = requestAnimationFrame(loop);
})();
</script>
{{ end }}
