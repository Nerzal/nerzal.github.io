{{ define "main" }}
<div class="not-found-page mw8 center ph3 ph4-l pv5 pv6-l tc">

    <h1 class="not-found-title">Page not found</h1>
    <p class="not-found-desc">The page you're looking for has moved, was removed, or never existed.</p>
    <div class="not-found-actions">
        <a href="{{ "/" | relURL }}" class="site-btn site-btn--primary">Back to Home</a>
        <a href="{{ "/blog/" | relURL }}" class="site-btn site-btn--outline">Read the Blog</a>
    </div>
</div>
{{ end }}
