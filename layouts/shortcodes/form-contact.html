<form class="contact-form" accept-charset="UTF-8" action="{{ .Get "action" }}" method="POST" role="form">
    <div class="contact-form-field">
        <label class="contact-form-label" for="name">{{ i18n "yourName" }}</label>
        <input class="contact-form-input" type="text" id="name" name="name" required placeholder=" " aria-labelledby="name">
    </div>
    <div class="contact-form-field">
        <label class="contact-form-label" for="email">{{ i18n "emailAddress" }}</label>
        <input class="contact-form-input" type="email" id="email" name="email" required placeholder=" " aria-labelledby="email">
        <p class="contact-form-hint">{{ i18n "emailRequiredNote" }}</p>
    </div>
    <div class="contact-form-field">
        <label class="contact-form-label" for="message">{{ i18n "message" }}</label>
        <textarea class="contact-form-input contact-form-textarea" id="message" name="message" aria-labelledby="message"></textarea>
    </div>
    <button class="site-btn site-btn--primary contact-form-submit" type="submit">{{ i18n "send" }}</button>
</form>
