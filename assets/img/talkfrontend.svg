<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="talkfrontend — a Markdown-driven talk slide viewer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#262833"/>
      <stop offset="100%" stop-color="#181a24"/>
    </linearGradient>
    <linearGradient id="accentFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff7f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00b35a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <circle cx="120" cy="800" r="260" fill="#00ff7f" opacity="0.05"/>
  <circle cx="1520" cy="80" r="220" fill="#00ff7f" opacity="0.05"/>

  <text x="90" y="150" font-family="Avenir, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#e4f1fe">talk<tspan fill="#00ff7f">frontend</tspan></text>
  <text x="92" y="196" font-family="Avenir, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" fill="#a9b4c9">Markdown slides, presented in the browser — no rebuild needed</text>

  <!-- browser window mockup -->
  <g transform="translate(90,240)">
    <rect x="0" y="0" width="900" height="560" rx="14" fill="#1c1e29" stroke="#333648" stroke-width="1.5"/>
    <rect x="0" y="0" width="900" height="46" rx="14" fill="#20222e"/>
    <rect x="0" y="32" width="900" height="14" fill="#20222e"/>
    <circle cx="28" cy="23" r="7" fill="#ff5f56"/>
    <circle cx="52" cy="23" r="7" fill="#ffbd2e"/>
    <circle cx="76" cy="23" r="7" fill="#27c93f"/>
    <rect x="330" y="12" width="360" height="22" rx="11" fill="#14161f"/>
    <text x="350" y="27" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#7d8aa3">talks.example.com/talk/my-talk-2026</text>

    <!-- slide content -->
    <text x="80" y="180" font-family="Avenir, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#e4f1fe">My Talk 2026</text>
    <rect x="80" y="205" width="140" height="6" rx="3" fill="#00ff7f"/>

    <g font-family="Avenir, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#c7d0e0">
      <circle cx="90" cy="270" r="4" fill="#00ff7f"/>
      <text x="110" y="277">Written as plain Markdown</text>
      <circle cx="90" cy="315" r="4" fill="#00ff7f"/>
      <text x="110" y="322">Eight slide layouts, no build step to publish</text>
      <circle cx="90" cy="360" r="4" fill="#00ff7f"/>
      <text x="110" y="367">Fullscreen mode with presenter-remote controls</text>
    </g>

    <!-- progress / nav footer -->
    <rect x="80" y="470" width="740" height="2" fill="#333648"/>
    <circle cx="86" cy="471" r="5" fill="#00ff7f"/>
    <circle cx="106" cy="471" r="5" fill="#4a4e63"/>
    <circle cx="126" cy="471" r="5" fill="#4a4e63"/>
    <circle cx="146" cy="471" r="5" fill="#4a4e63"/>
    <text x="740" y="477" font-family="Consolas, monospace" font-size="14" fill="#7d8aa3">1 / 12</text>
  </g>

  <!-- floating markdown -> app card -->
  <g transform="translate(1060,330)">
    <rect x="0" y="0" width="430" height="230" rx="12" fill="#14161f" stroke="#333648" stroke-width="1.5"/>
    <text x="24" y="38" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#7d8aa3">talk.md</text>
    <rect x="24" y="54" width="382" height="1" fill="#333648"/>
    <text x="24" y="86" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#ff8fb1">---</text>
    <text x="24" y="110" font-family="Consolas, 'Courier New', monospace" font-size="16"><tspan fill="#7fd5ff">title</tspan><tspan fill="#c7d0e0">: My Talk</tspan></text>
    <text x="24" y="134" font-family="Consolas, 'Courier New', monospace" font-size="16"><tspan fill="#7fd5ff">year</tspan><tspan fill="#c7d0e0">: 2026</tspan></text>
    <text x="24" y="158" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#ff8fb1">---</text>
    <text x="24" y="188" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#00ff7f">--- title</text>
    <text x="24" y="212" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#c7d0e0"># My Talk 2026</text>
  </g>

  <g transform="translate(1140,600)">
    <path d="M0,0 L100,0" stroke="#00ff7f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <text x="30" y="-14" font-family="Avenir, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#00ff7f" font-weight="600">fetch() at runtime</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#00ff7f"/>
    </marker>
  </defs>
</svg>
