<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330">
  <defs>
    <marker id="ar-lt2-layout" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="d-arrowhead"/>
    </marker>
  </defs>

  <text x="360" y="24" class="d-t d-bold" font-size="14" text-anchor="middle">for each language</text>
  <rect x="150" y="38" width="90" height="30" rx="15" class="d-pill d-b"/>
  <text x="195" y="58" class="d-t" font-size="12.5" text-anchor="middle">deDE</text>
  <rect x="255" y="38" width="90" height="30" rx="15" class="d-pill d-b"/>
  <text x="300" y="58" class="d-t" font-size="12.5" text-anchor="middle">enUS</text>
  <rect x="375" y="38" width="90" height="30" rx="15" class="d-pill d-b"/>
  <text x="420" y="58" class="d-t" font-size="12.5" text-anchor="middle">frFR</text>
  <rect x="480" y="38" width="90" height="30" rx="15" class="d-pill d-b"/>
  <text x="525" y="58" class="d-t" font-size="12.5" text-anchor="middle">esES</text>
  <line x1="360" y1="72" x2="360" y2="98" class="d-arrow" marker-end="url(#ar-lt2-layout)"/>

  <rect x="16" y="102" width="150" height="76" rx="9" class="d-box d-b"/>
  <text x="91" y="128" class="d-t d-bold" font-size="13" text-anchor="middle">1. Switch language</text>
  <text x="91" y="148" class="d-m" font-size="11.5" text-anchor="middle">addon.Set(</text>
  <text x="91" y="163" class="d-m" font-size="11.5" text-anchor="middle">"language", code)</text>
  <line x1="168" y1="140" x2="196" y2="140" class="d-arrow" marker-end="url(#ar-lt2-layout)"/>

  <rect x="200" y="102" width="150" height="76" rx="9" class="d-box d-b"/>
  <text x="275" y="128" class="d-t d-bold" font-size="13" text-anchor="middle">2. Build the window</text>
  <text x="275" y="148" class="d-m" font-size="11.5" text-anchor="middle">/lt config runs the</text>
  <text x="275" y="163" class="d-m" font-size="11.5" text-anchor="middle">real addon code</text>
  <line x1="352" y1="140" x2="380" y2="140" class="d-arrow" marker-end="url(#ar-lt2-layout)"/>

  <rect x="384" y="102" width="150" height="76" rx="9" class="d-box d-y"/>
  <text x="459" y="128" class="d-t d-bold" font-size="13" text-anchor="middle">3. Read the stub</text>
  <text x="459" y="148" class="d-m" font-size="11.5" text-anchor="middle">anchors in _points,</text>
  <text x="459" y="163" class="d-m" font-size="11.5" text-anchor="middle">GetStringWidth()</text>
  <line x1="536" y1="140" x2="564" y2="140" class="d-arrow" marker-end="url(#ar-lt2-layout)"/>

  <rect x="568" y="102" width="136" height="76" rx="9" class="d-box d-r"/>
  <text x="636" y="128" class="d-t d-bold" font-size="13" text-anchor="middle">4. Assert</text>
  <text x="636" y="148" class="d-m" font-size="11.5" text-anchor="middle">no overlap,</text>
  <text x="636" y="163" class="d-m" font-size="11.5" text-anchor="middle">fits the window</text>

  <rect x="16" y="214" width="688" height="100" rx="10" class="d-box d-y d-dashed"/>
  <text x="360" y="238" class="d-t d-bold" font-size="13" text-anchor="middle">What "width" means in the stub</text>
  <text x="360" y="262" class="d-t" font-size="12.5" text-anchor="middle">GetStringWidth() = string length in bytes x 6</text>
  <text x="360" y="284" class="d-m" font-size="12" text-anchor="middle">Not real font metrics. Longer languages (fr, es) get wider, so overflow</text>
  <text x="360" y="301" class="d-m" font-size="12" text-anchor="middle">regressions show up, but the exact pixels still need a look in game.</text>
</svg>
