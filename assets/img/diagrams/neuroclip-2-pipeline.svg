<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330">
  <defs>
    <marker id="ar-nc2pipe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="d-arrowhead"/>
    </marker>
  </defs>

  <!-- Row 1 -->
  <rect x="20" y="20" width="190" height="64" rx="9" class="d-box d-b"/>
  <text x="115" y="48" class="d-t d-bold" font-size="14" text-anchor="middle">1 VOD + chat</text>
  <text x="115" y="68" class="d-m" font-size="12" text-anchor="middle">HLS segments, resumable</text>
  <line x1="212" y1="52" x2="262" y2="52" class="d-arrow" marker-end="url(#ar-nc2pipe)"/>

  <rect x="265" y="20" width="190" height="64" rx="9" class="d-box d-b"/>
  <text x="360" y="48" class="d-t d-bold" font-size="14" text-anchor="middle">2 Audio track</text>
  <text x="360" y="68" class="d-m" font-size="12" text-anchor="middle">mic track to 16 kHz mono wav</text>
  <line x1="457" y1="52" x2="507" y2="52" class="d-arrow" marker-end="url(#ar-nc2pipe)"/>

  <rect x="510" y="20" width="190" height="64" rx="9" class="d-box d-y"/>
  <text x="605" y="48" class="d-t d-bold" font-size="14" text-anchor="middle">3 Transcript</text>
  <text x="605" y="68" class="d-m" font-size="12" text-anchor="middle">faster-whisper, word times</text>

  <!-- connector down -->
  <path d="M605 86 L605 120 L115 120 L115 150" class="d-arrow" fill="none" marker-end="url(#ar-nc2pipe)"/>

  <!-- Row 2 -->
  <rect x="20" y="154" width="190" height="64" rx="9" class="d-box d-g"/>
  <text x="115" y="182" class="d-t d-bold" font-size="14" text-anchor="middle">4 Candidates</text>
  <text x="115" y="202" class="d-m" font-size="12" text-anchor="middle">rule-based, Claude optional</text>
  <line x1="212" y1="186" x2="262" y2="186" class="d-arrow" marker-end="url(#ar-nc2pipe)"/>

  <rect x="265" y="154" width="190" height="64" rx="9" class="d-box d-r"/>
  <text x="360" y="182" class="d-t d-bold" font-size="14" text-anchor="middle">5 Render</text>
  <text x="360" y="202" class="d-m" font-size="12" text-anchor="middle">filter_complex + ASS + NVENC</text>
  <line x1="457" y1="186" x2="507" y2="186" class="d-arrow" marker-end="url(#ar-nc2pipe)"/>

  <rect x="510" y="154" width="190" height="64" rx="9" class="d-box d-b"/>
  <text x="605" y="182" class="d-t d-bold" font-size="14" text-anchor="middle">6 Review</text>
  <text x="605" y="202" class="d-m" font-size="12" text-anchor="middle">quality checks, then dashboard</text>

  <!-- side inputs -->
  <rect x="20" y="256" width="190" height="52" rx="9" class="d-box"/>
  <text x="115" y="278" class="d-t d-bold" font-size="13" text-anchor="middle">loudness, chat, markers</text>
  <text x="115" y="296" class="d-m" font-size="12" text-anchor="middle">viewer clips</text>
  <line x1="115" y1="254" x2="115" y2="222" class="d-arrow d-dashed" marker-end="url(#ar-nc2pipe)"/>

  <rect x="265" y="256" width="190" height="52" rx="9" class="d-box"/>
  <text x="360" y="278" class="d-t d-bold" font-size="13" text-anchor="middle">stream layout + profile</text>
  <text x="360" y="296" class="d-m" font-size="12" text-anchor="middle">cam box, game box, style</text>
  <line x1="360" y1="254" x2="360" y2="222" class="d-arrow d-dashed" marker-end="url(#ar-nc2pipe)"/>

  <rect x="510" y="256" width="190" height="52" rx="9" class="d-box"/>
  <text x="605" y="278" class="d-t d-bold" font-size="13" text-anchor="middle">Go owns every process</text>
  <text x="605" y="296" class="d-m" font-size="12" text-anchor="middle">context, priority, progress</text>
</svg>
