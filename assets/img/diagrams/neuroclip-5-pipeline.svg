<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <defs>
    <marker id="ar-nc5pipe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="d-arrowhead"/>
    </marker>
  </defs>

  <!-- Row 1: app path -->
  <rect x="10" y="30" width="110" height="70" rx="9" class="d-box d-b"/>
  <text x="65" y="60" class="d-t d-bold" font-size="13" text-anchor="middle">git push</text>
  <text x="65" y="78" class="d-m" font-size="11.5" text-anchor="middle">main</text>
  <line x1="122" y1="65" x2="148" y2="65" class="d-arrow" marker-end="url(#ar-nc5pipe)"/>

  <rect x="150" y="30" width="130" height="70" rx="9" class="d-box d-y"/>
  <text x="215" y="54" class="d-t d-bold" font-size="13" text-anchor="middle">test</text>
  <text x="215" y="72" class="d-m" font-size="11.5" text-anchor="middle">Go · dashboard</text>
  <text x="215" y="86" class="d-m" font-size="11.5" text-anchor="middle">website · licenses</text>
  <line x1="282" y1="65" x2="308" y2="65" class="d-arrow" marker-end="url(#ar-nc5pipe)"/>

  <rect x="310" y="30" width="130" height="70" rx="9" class="d-box d-y"/>
  <text x="375" y="54" class="d-t d-bold" font-size="13" text-anchor="middle">build</text>
  <text x="375" y="72" class="d-m" font-size="11.5" text-anchor="middle">image by SHA</text>
  <text x="375" y="86" class="d-m" font-size="11.5" text-anchor="middle">SBOM · provenance</text>
  <line x1="442" y1="65" x2="468" y2="65" class="d-arrow" marker-end="url(#ar-nc5pipe)"/>

  <rect x="470" y="30" width="110" height="70" rx="9" class="d-box d-r"/>
  <text x="525" y="54" class="d-t d-bold" font-size="13" text-anchor="middle">Trivy</text>
  <text x="525" y="72" class="d-m" font-size="11" text-anchor="middle">fixable CRITICAL</text>
  <text x="525" y="86" class="d-m" font-size="11.5" text-anchor="middle">= red</text>
  <line x1="582" y1="65" x2="608" y2="65" class="d-arrow" marker-end="url(#ar-nc5pipe)"/>

  <rect x="610" y="30" width="100" height="70" rx="9" class="d-box d-g"/>
  <text x="660" y="54" class="d-t d-bold" font-size="13" text-anchor="middle">cosign</text>
  <text x="660" y="72" class="d-m" font-size="11.5" text-anchor="middle">keyless sign</text>

  <!-- down to GHCR -->
  <line x1="660" y1="102" x2="660" y2="134" class="d-arrow" marker-end="url(#ar-nc5pipe)"/>

  <rect x="470" y="138" width="240" height="64" rx="9" class="d-box d-b"/>
  <text x="590" y="162" class="d-t d-bold" font-size="14" text-anchor="middle">GHCR</text>
  <text x="590" y="181" class="d-m" font-size="11.5" text-anchor="middle">image by SHA (signed)</text>
  <text x="590" y="194" class="d-m" font-size="11.5" text-anchor="middle">website image (moving tag)</text>

  <!-- app: GitOps PR -->
  <line x1="468" y1="170" x2="372" y2="170" class="d-arrow" marker-end="url(#ar-nc5pipe)"/>
  <rect x="150" y="138" width="220" height="64" rx="9" class="d-box d-y"/>
  <text x="260" y="162" class="d-t d-bold" font-size="13" text-anchor="middle">GitOps pull request</text>
  <text x="260" y="181" class="d-m" font-size="11.5" text-anchor="middle">change image reference</text>
  <text x="260" y="194" class="d-m" font-size="11.5" text-anchor="middle">private infra repository</text>

  <line x1="260" y1="204" x2="260" y2="246" class="d-arrow" marker-end="url(#ar-nc5pipe)"/>
  <text x="270" y="230" class="d-m" font-size="11.5">manual merge + apply</text>

  <rect x="150" y="250" width="220" height="56" rx="9" class="d-box d-g"/>
  <text x="260" y="274" class="d-t d-bold" font-size="13" text-anchor="middle">Kubernetes: app</text>
  <text x="260" y="292" class="d-m" font-size="11.5" text-anchor="middle">pinned to the SHA</text>

  <!-- site: Keel -->
  <line x1="590" y1="204" x2="590" y2="246" class="d-arrow d-dashed" marker-end="url(#ar-nc5pipe)"/>
  <text x="600" y="228" class="d-m" font-size="11.5">updater polls tag</text>
  <rect x="470" y="250" width="240" height="56" rx="9" class="d-box d-g"/>
  <text x="590" y="274" class="d-t d-bold" font-size="13" text-anchor="middle">Kubernetes: website</text>
  <text x="590" y="292" class="d-m" font-size="11.5" text-anchor="middle">rolling update, no PR</text>

  <text x="360" y="344" class="d-m" font-size="11.5" text-anchor="middle">CI never calls kubectl</text>
</svg>
