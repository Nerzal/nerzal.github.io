  <text x="137" y="108" class="d-t" font-size="12" text-anchor="middle">Events, login, level-up</text>
  <text x="137" y="140" class="d-t" font-size="12" text-anchor="middle">Journal, Alerts, Format</text>
  <text x="137" y="172" class="d-t" font-size="12" text-anchor="middle">Card, Widgets, TableView</text>
  <text x="137" y="204" class="d-t" font-size="12" text-anchor="middle">Theme, Frames, Locales</text>
