  <text x="360" y="170" class="d-t d-bold" font-size="13" text-anchor="middle">LevelTimerAPI</text>
  <text x="360" y="200" class="d-m" font-size="11.5" text-anchor="middle">one table,</text>
  <text x="360" y="216" class="d-m" font-size="11.5" text-anchor="middle">filled by modules</text>

  <line x1="264" y1="180" x2="298" y2="180" class="d-arrow" marker-end="url(#ar-lt4api)"/>

  <!-- Goals -->
  <rect x="458" y="24" width="250" height="150" rx="9" class="d-box d-g"/>
