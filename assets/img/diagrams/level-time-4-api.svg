  <text x="583" y="146" class="d-m" font-size="11.5" text-anchor="middle">own namespace, own SavedVariables</text>
  <line x1="456" y1="99" x2="422" y2="150" class="d-arrow" marker-end="url(#ar-lt4api)"/>

