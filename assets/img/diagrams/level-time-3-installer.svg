<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330">
  <defs>
    <marker id="ar-lt3-installer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="d-arrowhead"/>
    </marker>
  </defs>

  <rect x="10" y="20" width="150" height="58" rx="9" class="d-box d-b"/>
  <text x="85" y="44" class="d-t d-bold" font-size="13" text-anchor="middle">Read .toc files</text>
  <text x="85" y="62" class="d-m" font-size="11.5" text-anchor="middle">file list + Media/</text>
  <line x1="162" y1="49" x2="188" y2="49" class="d-arrow" marker-end="url(#ar-lt3-installer)"/>

  <rect x="192" y="20" width="150" height="58" rx="9" class="d-box d-b"/>
  <text x="267" y="44" class="d-t d-bold" font-size="13" text-anchor="middle">Find WoW root</text>
  <text x="267" y="62" class="d-m" font-size="11.5" text-anchor="middle">-wow / WOW_DIR / scan</text>
  <line x1="344" y1="49" x2="370" y2="49" class="d-arrow" marker-end="url(#ar-lt3-installer)"/>

  <rect x="374" y="20" width="150" height="58" rx="9" class="d-box d-b"/>
  <text x="449" y="44" class="d-t d-bold" font-size="13" text-anchor="middle">Find flavors</text>
  <text x="449" y="62" class="d-m" font-size="11.5" text-anchor="middle">_retail_, _classic_era_ ...</text>
  <line x1="526" y1="49" x2="552" y2="49" class="d-arrow" marker-end="url(#ar-lt3-installer)"/>

  <rect x="556" y="20" width="154" height="58" rx="9" class="d-box d-y"/>
  <text x="633" y="44" class="d-t d-bold" font-size="13" text-anchor="middle">Build plan</text>
  <text x="633" y="62" class="d-m" font-size="11.5" text-anchor="middle">per addon and flavor</text>
  <line x1="633" y1="80" x2="633" y2="112" class="d-arrow" marker-end="url(#ar-lt3-installer)"/>

  <rect x="480" y="116" width="230" height="74" rx="9" class="d-box"/>
  <text x="595" y="138" class="d-t d-bold" font-size="13" text-anchor="middle">Compare bytes</text>
  <text x="595" y="156" class="d-m" font-size="11.5" text-anchor="middle">+ new   ~ updated   unchanged</text>
  <text x="595" y="173" class="d-m" font-size="11.5" text-anchor="middle">- stale (from old manifest)</text>
  <line x1="478" y1="153" x2="446" y2="153" class="d-arrow" marker-end="url(#ar-lt3-installer)"/>

  <rect x="226" y="116" width="216" height="74" rx="9" class="d-box"/>
  <text x="334" y="138" class="d-t d-bold" font-size="13" text-anchor="middle">Show plan, ask</text>
  <text x="334" y="156" class="d-m" font-size="11.5" text-anchor="middle">--dry-run stops here</text>
  <text x="334" y="173" class="d-m" font-size="11.5" text-anchor="middle">--yes skips the question</text>
  <line x1="224" y1="153" x2="192" y2="153" class="d-arrow" marker-end="url(#ar-lt3-installer)"/>

  <rect x="10" y="116" width="180" height="74" rx="9" class="d-box d-g"/>
  <text x="100" y="138" class="d-t d-bold" font-size="13" text-anchor="middle">Apply</text>
  <text x="100" y="156" class="d-m" font-size="11.5" text-anchor="middle">atomic writes, then</text>
  <text x="100" y="173" class="d-m" font-size="11.5" text-anchor="middle">.install-manifest.json</text>

  <rect x="10" y="236" width="700" height="62" rx="9" class="d-box d-r"/>
  <text x="360" y="260" class="d-t d-bold" font-size="13" text-anchor="middle">Hard guard: any path containing WTF is refused</text>
  <text x="360" y="280" class="d-m" font-size="12" text-anchor="middle">SavedVariables live under WTF, so the installer can never touch your settings or history</text>
</svg>
