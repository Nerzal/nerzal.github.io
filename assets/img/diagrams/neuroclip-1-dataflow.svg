<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330">
  <defs>
    <marker id="ar-nc1flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="d-arrowhead"/>
    </marker>
  </defs>

  <!-- Row 1 -->
  <rect x="14" y="30" width="116" height="66" rx="9" class="d-box d-b"/>
  <text x="72" y="56" class="d-t d-bold" font-size="13" text-anchor="middle">1 Stream</text>
  <text x="72" y="76" class="d-m" font-size="11" text-anchor="middle">audio tracks</text>
  <line x1="132" y1="63" x2="154" y2="63" class="d-arrow" marker-end="url(#ar-nc1flow)"/>

  <rect x="156" y="30" width="116" height="66" rx="9" class="d-box d-b"/>
  <text x="214" y="56" class="d-t d-bold" font-size="13" text-anchor="middle">2 VOD + chat</text>
  <text x="214" y="76" class="d-m" font-size="11" text-anchor="middle">Twitch APIs</text>
  <line x1="274" y1="63" x2="296" y2="63" class="d-arrow" marker-end="url(#ar-nc1flow)"/>

  <rect x="298" y="30" width="116" height="66" rx="9" class="d-box d-y"/>
  <text x="356" y="56" class="d-t d-bold" font-size="13" text-anchor="middle">3 Transcribe</text>
  <text x="356" y="76" class="d-m" font-size="11" text-anchor="middle">Whisper, mic</text>
  <line x1="416" y1="63" x2="438" y2="63" class="d-arrow" marker-end="url(#ar-nc1flow)"/>

  <rect x="440" y="30" width="116" height="66" rx="9" class="d-box d-y"/>
  <text x="498" y="56" class="d-t d-bold" font-size="13" text-anchor="middle">4 Analyse</text>
  <text x="498" y="76" class="d-m" font-size="11" text-anchor="middle">candidates</text>
  <line x1="558" y1="63" x2="580" y2="63" class="d-arrow" marker-end="url(#ar-nc1flow)"/>

  <rect x="582" y="30" width="124" height="66" rx="9" class="d-box d-y"/>
  <text x="644" y="56" class="d-t d-bold" font-size="13" text-anchor="middle">5 Suggest</text>
  <text x="644" y="76" class="d-m" font-size="11" text-anchor="middle">Claude or rules</text>

  <!-- Down -->
  <line x1="644" y1="98" x2="644" y2="188" class="d-arrow" marker-end="url(#ar-nc1flow)"/>

  <!-- Row 2 (right to left) -->
  <rect x="582" y="192" width="124" height="66" rx="9" class="d-box d-r"/>
  <text x="644" y="218" class="d-t d-bold" font-size="13" text-anchor="middle">6 Edit</text>
  <text x="644" y="238" class="d-m" font-size="11" text-anchor="middle">project editor</text>
  <line x1="580" y1="225" x2="558" y2="225" class="d-arrow" marker-end="url(#ar-nc1flow)"/>

  <rect x="440" y="192" width="116" height="66" rx="9" class="d-box d-y"/>
  <text x="498" y="218" class="d-t d-bold" font-size="13" text-anchor="middle">7 Render</text>
  <text x="498" y="238" class="d-m" font-size="11" text-anchor="middle">ffmpeg</text>
  <line x1="438" y1="225" x2="416" y2="225" class="d-arrow" marker-end="url(#ar-nc1flow)"/>

  <rect x="298" y="192" width="116" height="66" rx="9" class="d-box d-y"/>
  <text x="356" y="218" class="d-t d-bold" font-size="13" text-anchor="middle">8 Ready</text>
  <text x="356" y="238" class="d-m" font-size="11" text-anchor="middle">ready + plan</text>
  <line x1="296" y1="225" x2="274" y2="225" class="d-arrow" marker-end="url(#ar-nc1flow)"/>

  <rect x="156" y="192" width="116" height="66" rx="9" class="d-box d-r"/>
  <text x="214" y="218" class="d-t d-bold" font-size="13" text-anchor="middle">9 Review</text>
  <text x="214" y="238" class="d-m" font-size="11" text-anchor="middle">you decide</text>
  <line x1="154" y1="225" x2="132" y2="225" class="d-arrow" marker-end="url(#ar-nc1flow)"/>
  <text x="143" y="215" class="d-m" font-size="10.5" text-anchor="middle">yes</text>

  <rect x="14" y="192" width="116" height="66" rx="9" class="d-box d-g"/>
  <text x="72" y="218" class="d-t d-bold" font-size="13" text-anchor="middle">10 Upload</text>
  <text x="72" y="238" class="d-m" font-size="11" text-anchor="middle">API or bridge</text>

  <!-- Rework loop -->
  <polyline points="214,260 214,282 644,282 644,262" class="d-arrow d-dashed" fill="none" marker-end="url(#ar-nc1flow)"/>
  <text x="430" y="276" class="d-m" font-size="11.5" text-anchor="middle">no: rework in the editor</text>

  <!-- Legend -->
  <text x="14" y="314" class="d-m" font-size="11.5">blue: capture · yellow: automatic steps · red: you decide · green: publishing, only after confirmation</text>
</svg>
