<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480">
  <defs>
    <marker id="ar-nc1comp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="d-arrowhead"/>
    </marker>
  </defs>

  <!-- Dashboard -->
  <rect x="20" y="40" width="120" height="56" rx="9" class="d-box d-b"/>
  <text x="80" y="64" class="d-t d-bold" font-size="14" text-anchor="middle">Dashboard</text>
  <text x="80" y="82" class="d-m" font-size="11" text-anchor="middle">React · TypeScript</text>
  <line x1="142" y1="68" x2="228" y2="68" class="d-arrow" marker-start="url(#ar-nc1comp)" marker-end="url(#ar-nc1comp)"/>
  <text x="185" y="60" class="d-m" font-size="11" text-anchor="middle">REST · SSE</text>

  <!-- Cockpit -->
  <rect x="230" y="14" width="300" height="256" rx="12" class="d-box d-g"/>
  <text x="380" y="38" class="d-t d-bold" font-size="14" text-anchor="middle">Cockpit · one Go process</text>

  <rect x="246" y="52" width="128" height="46" rx="8" class="d-box d-b"/>
  <text x="310" y="72" class="d-t d-bold" font-size="12.5" text-anchor="middle">API + guards</text>
  <text x="310" y="88" class="d-m" font-size="11" text-anchor="middle">access checks</text>

  <rect x="386" y="52" width="128" height="46" rx="8" class="d-box d-b"/>
  <text x="450" y="72" class="d-t d-bold" font-size="12.5" text-anchor="middle">Job runner</text>
  <text x="450" y="88" class="d-m" font-size="11" text-anchor="middle">tracks child processes</text>

  <rect x="246" y="106" width="268" height="60" rx="8" class="d-box d-y"/>
  <text x="380" y="123" class="d-t d-bold" font-size="12.5" text-anchor="middle">Domain logic</text>
  <text x="380" y="140" class="d-m" font-size="11" text-anchor="middle">ranking · render · episodes</text>
  <text x="380" y="155" class="d-m" font-size="11" text-anchor="middle">timeline · cleanup · profile</text>

  <rect x="246" y="172" width="128" height="46" rx="8" class="d-box d-r"/>
  <text x="310" y="192" class="d-t d-bold" font-size="12.5" text-anchor="middle">Live saver</text>
  <text x="310" y="208" class="d-m" font-size="11" text-anchor="middle">+ process priority</text>

  <rect x="386" y="172" width="128" height="46" rx="8" class="d-box d-b"/>
  <text x="450" y="192" class="d-t d-bold" font-size="12.5" text-anchor="middle">OBS client</text>
  <text x="450" y="208" class="d-m" font-size="11" text-anchor="middle">status cache</text>

  <text x="380" y="248" class="d-m" font-size="11.5" text-anchor="middle">also serves the built dashboard</text>

  <!-- Right column -->
  <rect x="570" y="30" width="140" height="48" rx="9" class="d-box d-b"/>
  <text x="640" y="52" class="d-t d-bold" font-size="13" text-anchor="middle">OBS Studio</text>
  <text x="640" y="68" class="d-m" font-size="11" text-anchor="middle">WebSocket</text>
  <polyline points="514,195 554,195 554,54 568,54" class="d-arrow" fill="none" marker-end="url(#ar-nc1comp)"/>

  <rect x="570" y="94" width="140" height="48" rx="9" class="d-box d-b"/>
  <text x="640" y="116" class="d-t d-bold" font-size="12.5" text-anchor="middle">Twitch · YouTube</text>
  <text x="640" y="132" class="d-m" font-size="11" text-anchor="middle">HTTPS · OAuth</text>
  <line x1="532" y1="118" x2="568" y2="118" class="d-arrow" marker-end="url(#ar-nc1comp)"/>

  <rect x="570" y="158" width="140" height="48" rx="9" class="d-box d-y"/>
  <text x="640" y="180" class="d-t d-bold" font-size="13" text-anchor="middle">Upload bridge</text>
  <text x="640" y="196" class="d-m" font-size="11" text-anchor="middle">local bridge</text>
  <line x1="532" y1="182" x2="568" y2="182" class="d-arrow" marker-end="url(#ar-nc1comp)"/>

  <rect x="570" y="222" width="140" height="48" rx="9" class="d-box d-y"/>
  <text x="640" y="244" class="d-t d-bold" font-size="12.5" text-anchor="middle">Chrome extension</text>
  <text x="640" y="260" class="d-m" font-size="11" text-anchor="middle">fills upload forms</text>
  <line x1="642" y1="208" x2="642" y2="220" class="d-arrow" marker-end="url(#ar-nc1comp)"/>

  <!-- Child processes -->
  <line x1="380" y1="272" x2="380" y2="306" class="d-arrow"/>
  <line x1="95" y1="306" x2="625" y2="306" class="d-arrow"/>
  <text x="396" y="298" class="d-m" font-size="11.5">spawned as child processes</text>
  <line x1="95" y1="306" x2="95" y2="332" class="d-arrow" marker-end="url(#ar-nc1comp)"/>
  <line x1="270" y1="306" x2="270" y2="332" class="d-arrow" marker-end="url(#ar-nc1comp)"/>
  <line x1="450" y1="306" x2="450" y2="332" class="d-arrow" marker-end="url(#ar-nc1comp)"/>
  <line x1="625" y1="306" x2="625" y2="332" class="d-arrow" marker-end="url(#ar-nc1comp)"/>

  <rect x="20" y="336" width="150" height="54" rx="9" class="d-box d-r"/>
  <text x="95" y="360" class="d-t d-bold" font-size="13" text-anchor="middle">ffmpeg · ffprobe</text>
  <text x="95" y="378" class="d-m" font-size="11" text-anchor="middle">cut · render · probe</text>

  <rect x="195" y="336" width="150" height="54" rx="9" class="d-box d-r"/>
  <text x="270" y="360" class="d-t d-bold" font-size="13" text-anchor="middle">Python helpers</text>
  <text x="270" y="378" class="d-m" font-size="11" text-anchor="middle">speech · tracking</text>

  <rect x="375" y="336" width="150" height="54" rx="9" class="d-box d-r"/>
  <text x="450" y="360" class="d-t d-bold" font-size="13" text-anchor="middle">claude CLI</text>
  <text x="450" y="378" class="d-m" font-size="11" text-anchor="middle">headless jobs</text>

  <rect x="550" y="336" width="150" height="54" rx="9" class="d-box d-r"/>
  <text x="625" y="360" class="d-t d-bold" font-size="13" text-anchor="middle">Real-ESRGAN</text>
  <text x="625" y="378" class="d-m" font-size="10.5" text-anchor="middle">upscaler · optional</text>

  <!-- Workspace -->
  <line x1="360" y1="392" x2="360" y2="418" class="d-arrow d-dashed" marker-end="url(#ar-nc1comp)"/>
  <rect x="20" y="422" width="680" height="46" rx="9" class="d-box d-y"/>
  <text x="360" y="442" class="d-t d-bold" font-size="13" text-anchor="middle">Workspace + profile</text>
  <text x="360" y="459" class="d-m" font-size="11.5" text-anchor="middle">videos, reports, state files and the streamer profile: the only place with personal data</text>
</svg>
