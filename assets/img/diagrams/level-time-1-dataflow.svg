<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350">
  <defs>
    <marker id="ar-lt1-dataflow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="d-arrowhead"/>
    </marker>
  </defs>

  <!-- WoW client -->
  <rect x="90" y="12" width="540" height="50" rx="9" class="d-box d-y"/>
  <text x="360" y="34" class="d-t d-bold" font-size="14" text-anchor="middle">WoW client</text>
  <text x="360" y="52" class="d-m" font-size="12" text-anchor="middle">PLAYER_XP_UPDATE · CHAT_MSG_* · PLAYER_DEAD · PLAYER_LEVEL_UP</text>
  <line x1="360" y1="64" x2="360" y2="84" class="d-arrow" marker-end="url(#ar-lt1-dataflow)"/>

  <!-- Core -->
  <rect x="120" y="88" width="480" height="52" rx="9" class="d-box d-b"/>
  <text x="360" y="110" class="d-t d-bold" font-size="14" text-anchor="middle">Core + Lib</text>
  <text x="360" y="128" class="d-m" font-size="12" text-anchor="middle">one event frame · ns.RegisterEvent · ns.SafeCall · ns.Every</text>
  <line x1="260" y1="142" x2="150" y2="170" class="d-arrow" marker-end="url(#ar-lt1-dataflow)"/>

  <!-- Row 2 -->
  <rect x="20" y="174" width="210" height="64" rx="9" class="d-box d-b"/>
  <text x="125" y="198" class="d-t d-bold" font-size="14" text-anchor="middle">Tracking/</text>
  <text x="125" y="216" class="d-m" font-size="12" text-anchor="middle">Stats counters · Journal</text>
  <text x="125" y="230" class="d-m" font-size="11" text-anchor="middle">level / session / instance</text>

  <rect x="285" y="174" width="190" height="64" rx="9" class="d-box d-g"/>
  <text x="380" y="198" class="d-t d-bold" font-size="14" text-anchor="middle">History/</text>
  <text x="380" y="216" class="d-m" font-size="12" text-anchor="middle">level snapshots · analysis</text>
  <text x="380" y="230" class="d-m" font-size="11" text-anchor="middle">forecast · records</text>

  <rect x="530" y="174" width="170" height="64" rx="9" class="d-box d-r"/>
  <text x="615" y="198" class="d-t d-bold" font-size="14" text-anchor="middle">SavedVariables</text>
  <text x="615" y="216" class="d-m" font-size="12" text-anchor="middle">written by the client</text>
  <text x="615" y="230" class="d-m" font-size="11" text-anchor="middle">on logout / reload</text>

  <line x1="232" y1="206" x2="283" y2="206" class="d-arrow" marker-end="url(#ar-lt1-dataflow)"/>
  <text x="258" y="196" class="d-m" font-size="10.5" text-anchor="middle">level-up</text>
  <line x1="477" y1="206" x2="528" y2="206" class="d-arrow d-dashed" marker-end="url(#ar-lt1-dataflow)"/>
  <text x="503" y="196" class="d-m" font-size="10.5" text-anchor="middle">persist</text>

  <!-- UI -->
  <rect x="200" y="280" width="320" height="56" rx="9" class="d-box d-b"/>
  <text x="360" y="304" class="d-t d-bold" font-size="14" text-anchor="middle">UI/</text>
  <text x="360" y="322" class="d-m" font-size="12" text-anchor="middle">windows · layouts · alerts · polls at 0.25 s</text>
  <path d="M250 278 L125 278 L125 240" class="d-arrow d-dashed" fill="none" marker-end="url(#ar-lt1-dataflow)"/>
  <path d="M430 278 L430 240" class="d-arrow d-dashed" fill="none" marker-end="url(#ar-lt1-dataflow)"/>
  <text x="190" y="268" class="d-m" font-size="11" text-anchor="middle">reads getters</text>
</svg>
