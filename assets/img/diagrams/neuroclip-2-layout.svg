<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <defs>
    <marker id="ar-nc2lay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="d-arrowhead"/>
    </marker>
  </defs>

  <!-- Source frame 16:9 -->
  <text x="170" y="30" class="d-t d-bold" font-size="14" text-anchor="middle">Source 1920 x 1080</text>
  <rect x="20" y="46" width="300" height="169" rx="6" class="d-box"/>
  <rect x="232" y="54" width="80" height="60" rx="4" class="d-box d-y"/>
  <text x="272" y="88" class="d-t d-bold" font-size="12" text-anchor="middle">cam</text>
  <rect x="30" y="60" width="190" height="140" rx="4" class="d-box d-g"/>
  <text x="125" y="134" class="d-t d-bold" font-size="12" text-anchor="middle">game</text>
  <text x="170" y="240" class="d-m" font-size="12" text-anchor="middle">two crop boxes, from the stream layout</text>
  <text x="170" y="258" class="d-m" font-size="12" text-anchor="middle">or the profile</text>

  <!-- Short 9:16 -->
  <text x="520" y="30" class="d-t d-bold" font-size="14" text-anchor="middle">Short 1080 x 1920</text>
  <rect x="400" y="46" width="240" height="380" rx="12" class="d-box"/>
  <rect x="404" y="50" width="232" height="86" rx="8" class="d-box d-y"/>
  <text x="520" y="88" class="d-t d-bold" font-size="13" text-anchor="middle">facecam strip</text>
  <text x="520" y="106" class="d-m" font-size="11.5" text-anchor="middle">1080 x camH, scaled</text>
  <rect x="404" y="140" width="232" height="282" rx="8" class="d-box d-g"/>
  <text x="520" y="170" class="d-t d-bold" font-size="13" text-anchor="middle">game strip</text>
  <text x="520" y="188" class="d-m" font-size="11.5" text-anchor="middle">1080 x (1920 - camH)</text>
  <rect x="424" y="206" width="192" height="40" rx="8" class="d-box d-r"/>
  <text x="520" y="231" class="d-t d-bold" font-size="13" text-anchor="middle">subtitle zone</text>
  <text x="520" y="278" class="d-m" font-size="11.5" text-anchor="middle">subtitles burned on top</text>
  <text x="520" y="396" class="d-m" font-size="11.5" text-anchor="middle">bottom: platform UI, keep clear</text>

  <!-- arrows -->
  <path d="M314 84 L398 90" class="d-arrow" fill="none" marker-end="url(#ar-nc2lay)"/>
  <path d="M222 170 L398 250" class="d-arrow" fill="none" marker-end="url(#ar-nc2lay)"/>

  <text x="170" y="330" class="d-t d-bold" font-size="13" text-anchor="middle">crop, scale, vstack</text>
  <text x="170" y="350" class="d-m" font-size="12" text-anchor="middle">then burn in subtitles</text>
</svg>
