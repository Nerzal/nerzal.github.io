<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320">
  <defs>
    <marker id="ar-nc5auth" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="d-arrowhead"/>
    </marker>
  </defs>

  <rect x="10" y="110" width="110" height="56" rx="9" class="d-box d-b"/>
  <text x="65" y="136" class="d-t d-bold" font-size="13" text-anchor="middle">Browser</text>
  <text x="65" y="154" class="d-m" font-size="11.5" text-anchor="middle">app.neuroclip.de</text>
  <line x1="122" y1="138" x2="168" y2="138" class="d-arrow" marker-end="url(#ar-nc5auth)"/>
  <text x="145" y="128" class="d-m" font-size="11" text-anchor="middle">HTTPS</text>

  <rect x="170" y="110" width="110" height="56" rx="9" class="d-box d-y"/>
  <text x="225" y="136" class="d-t d-bold" font-size="13" text-anchor="middle">Traefik</text>
  <text x="225" y="154" class="d-m" font-size="11.5" text-anchor="middle">TLS ingress</text>
  <line x1="282" y1="138" x2="318" y2="138" class="d-arrow" marker-end="url(#ar-nc5auth)"/>

  <!-- pod -->
  <rect x="320" y="60" width="390" height="170" rx="12" class="d-box d-dashed"/>
  <text x="332" y="80" class="d-m" font-size="11.5">one deployment</text>

  <rect x="336" y="104" width="150" height="68" rx="9" class="d-box d-r"/>
  <text x="411" y="130" class="d-t d-bold" font-size="13" text-anchor="middle">oauth2-proxy</text>
  <text x="411" y="148" class="d-m" font-size="11.5" text-anchor="middle">checks login</text>
  <text x="411" y="161" class="d-m" font-size="11.5" text-anchor="middle">vouches for request</text>

  <line x1="488" y1="138" x2="540" y2="138" class="d-arrow" marker-end="url(#ar-nc5auth)"/>
  <text x="514" y="128" class="d-m" font-size="11" text-anchor="middle">internal</text>

  <rect x="542" y="104" width="154" height="68" rx="9" class="d-box d-g"/>
  <text x="619" y="130" class="d-t d-bold" font-size="13" text-anchor="middle">app</text>
  <text x="619" y="148" class="d-m" font-size="11.5" text-anchor="middle">Go server, needs proof</text>
  <text x="619" y="161" class="d-m" font-size="11.5" text-anchor="middle">of the proxy</text>

  <!-- Keycloak -->
  <rect x="336" y="256" width="150" height="50" rx="9" class="d-box d-b"/>
  <text x="411" y="278" class="d-t d-bold" font-size="13" text-anchor="middle">Keycloak</text>
  <text x="411" y="295" class="d-m" font-size="11.5" text-anchor="middle">SSO identity provider</text>
  <line x1="411" y1="174" x2="411" y2="254" class="d-arrow" marker-start="url(#ar-nc5auth)" marker-end="url(#ar-nc5auth)"/>
  <text x="421" y="218" class="d-m" font-size="11.5">OIDC code flow + PKCE</text>

  <text x="360" y="30" class="d-m" font-size="11.5" text-anchor="middle">Only the proxy is exposed; the app itself is not</text>
</svg>
