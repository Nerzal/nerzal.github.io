<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300">
  <defs>
    <marker id="ar-lt4ease" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="d-arrowhead"/>
    </marker>
  </defs>

  <line x1="70" y1="240" x2="70" y2="30" class="d-arrow" marker-end="url(#ar-lt4ease)"/>
  <line x1="70" y1="240" x2="700" y2="240" class="d-arrow" marker-end="url(#ar-lt4ease)"/>
  <text x="62" y="46" class="d-m" font-size="11.5" text-anchor="end">to</text>
  <text x="62" y="244" class="d-m" font-size="11.5" text-anchor="end">from</text>
  <text x="385" y="276" class="d-m" font-size="12" text-anchor="middle">progress = elapsed / SPIN_SECONDS (0 to 1, 4 s)</text>

  <line x1="70" y1="50" x2="670" y2="50" class="d-divider"/>
  <line x1="670" y1="50" x2="670" y2="240" class="d-divider"/>

  <path d="M70 240 L130 189 L190 147 L250 115 L310 91 L370 74 L430 62 L490 55 L550 52 L610 50 L670 50" class="d-arrow d-b" style="fill:none" stroke-width="3"/>
  <circle cx="70" cy="240" r="4" class="d-b"/>
  <circle cx="670" cy="50" r="4" class="d-g"/>

  <line x1="240" y1="118" x2="310" y2="172" class="d-divider"/>
  <rect x="250" y="172" width="200" height="46" rx="9" class="d-box d-y"/>
  <text x="350" y="192" class="d-t d-bold" font-size="13" text-anchor="middle">fast start</text>
  <text x="350" y="209" class="d-m" font-size="11.5" text-anchor="middle">Ease(0.25) is about 0.58</text>

  <rect x="470" y="150" width="210" height="46" rx="9" class="d-box d-g"/>
  <text x="575" y="170" class="d-t d-bold" font-size="13" text-anchor="middle">soft stop</text>
  <text x="575" y="187" class="d-m" font-size="11.5" text-anchor="middle">slope reaches 0 at progress 1</text>

  <text x="385" y="20" class="d-t d-bold" font-size="13" text-anchor="middle">Ease(p) = 1 - (1 - p)^3 : wheel rotation between from and to</text>
</svg>
